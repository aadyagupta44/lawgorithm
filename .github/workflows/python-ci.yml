name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip" # Automatically caches dependencies for faster runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      # Since we mock Pinecone and Groq in conftest.py, we don't need real API keys here,
      # but we provide dummy environment variables just in case the app config requires them to boot up.
      env:
        GROQ_API_KEY: "dummy_groq_key"
        PINECONE_API_KEY: "dummy_pinecone_key"
      run: |
        python -m pytest tests/ -v
